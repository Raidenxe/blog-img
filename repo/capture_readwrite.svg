<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Consolas,Menlo,'Courier New',monospace">
  <rect width="960" height="300" fill="#1e1e1e"/>
  <rect x="0" y="0" width="960" height="32" fill="#323232"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="480" y="21" text-anchor="middle" font-size="13" fill="#cccccc">读写验证：主写 → 从读</text>

  <text x="16" y="56" font-size="13" fill="#6a9955"># 1) 主节点 mysql0 写入</text>
  <text x="16" y="78" font-size="13" fill="#d4d4d4">$ docker exec mysql0 mysql -uroot -p*** appdb -e \</text>
  <text x="16" y="98" font-size="13" fill="#d4d4d4">  "INSERT INTO test_mgr VALUES (1,'hello'),(2,'world'),(3,'mgr-works'); SELECT id,note FROM test_mgr;"</text>
  <text x="16" y="122" font-size="13" fill="#d4d4d4">id      note</text>
  <text x="16" y="142" font-size="13" fill="#6a9955">1       hello</text>
  <text x="16" y="162" font-size="13" fill="#6a9955">2       world</text>
  <text x="16" y="182" font-size="13" fill="#6a9955">3       mgr-works</text>

  <text x="16" y="216" font-size="13" fill="#6a9955"># 2) 从节点 mysql1 读取（应为一致数据）</text>
  <text x="16" y="238" font-size="13" fill="#d4d4d4">$ docker exec mysql1 mysql -uroot -p*** appdb -e "SELECT id,note FROM test_mgr;"</text>
  <text x="16" y="260" font-size="13" fill="#d4d4d4">id      note</text>
  <text x="16" y="280" font-size="13" fill="#6a9955">1       hello</text>
  <text x="16" y="296" font-size="13" fill="#6a9955">2       world</text>
  <text x="36" y="280" font-size="13" fill="#6a9955">3       mgr-works</text>
  <text x="16" y="296" font-size="13" fill="#6a9955"># 主写从读一致 ✓</text>
</svg>