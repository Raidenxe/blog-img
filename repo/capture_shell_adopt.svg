<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" font-family="Consolas,Menlo,'Courier New',monospace">
  <rect width="960" height="250" fill="#1e1e1e"/>
  <rect x="0" y="0" width="960" height="32" fill="#323232"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="480" y="21" text-anchor="middle" font-size="13" fill="#cccccc">mysqlsh - adoptFromGr 接管现有组</text>

  <text x="16" y="56" font-size="13" fill="#6a9955">$ mysqlsh --uri root@172.98.0.10:3306 --js</text>
  <text x="16" y="78" font-size="13" fill="#d4d4d4">mysql-js&gt; dba.createCluster('mgrCluster', {adoptFromGr:true})</text>
  <text x="16" y="100" font-size="13" fill="#6a9955">A new InnoDB Cluster will be created based on the existing</text>
  <text x="16" y="120" font-size="13" fill="#6a9955">replication group on instance '172.98.0.10:3306'.</text>
  <text x="16" y="142" font-size="13" fill="#d4d4d4">Creating InnoDB Cluster 'mgrCluster' on '172.98.0.10:3306'...</text>
  <text x="16" y="162" font-size="13" fill="#d4d4d4">Adding Seed Instance...</text>
  <text x="16" y="182" font-size="13" fill="#d4d4d4">Adding Instance '172.98.0.12:3306'...  '172.98.0.10:3306'... '172.98.0.11:3306'...</text>
  <text x="16" y="202" font-size="13" fill="#d4d4d4">Resetting distributed recovery credentials across the cluster...</text>
  <text x="16" y="224" font-size="13" fill="#6a9955">Cluster successfully created based on existing replication group.</text>
</svg>