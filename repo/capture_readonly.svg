<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" font-family="Consolas,Menlo,'Courier New',monospace">
  <rect width="960" height="260" fill="#1e1e1e"/>
  <rect x="0" y="0" width="960" height="32" fill="#323232"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="480" y="21" text-anchor="middle" font-size="13" fill="#cccccc">从节点只读约束测试</text>

  <text x="16" y="60" font-size="13" fill="#6a9955"># 从节点 mysql2 尝试写入（单主模式应被拒绝）</text>
  <text x="16" y="82" font-size="13" fill="#d4d4d4">$ docker exec mysql2 mysql -uroot -p*** appdb -e \</text>
  <text x="16" y="102" font-size="13" fill="#d4d4d4">  "INSERT INTO test_mgr VALUES (99,'blocked');"</text>
  <text x="16" y="132" font-size="13" fill="#f48771">ERROR 1290 (HY000) at line 1:</text>
  <text x="16" y="154" font-size="13" fill="#f48771">The MySQL server is running with the --super-read-only option</text>
  <text x="16" y="176" font-size="13" fill="#f48771">so it cannot execute this statement</text>
  <text x="16" y="212" font-size="13" fill="#6a9955"># 从节点只读约束生效，阻止未授权写入 ✓</text>
</svg>